<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="'Trebuchet MS', Verdana, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b3a"/>
      <stop offset="0.65" stop-color="#2c3b2f"/>
      <stop offset="1" stop-color="#3a3326"/>
    </linearGradient>
    <style>
      .hud  { font-weight: bold; paint-order: stroke; stroke: #000; stroke-linejoin: round; }
      .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-weight: bold;
              paint-order: stroke; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; }
      .tag  { font-family: Verdana, sans-serif; font-size: 12px; font-weight: bold; fill: #fff; }
      .note { font-family: Verdana, sans-serif; font-size: 13px; fill: #d8dde3; }
    </style>
  </defs>

  <!-- game-ish background -->
  <rect width="1020" height="500" rx="10" fill="url(#sky)"/>

  <!-- ===================== BANNER ===================== -->
  <rect x="232" y="44" width="500" height="160" rx="6" fill="#e63c3c" fill-opacity="0.10"
        stroke="#e63c3c" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="232" y="28" width="66" height="18" rx="3" fill="#e63c3c"/>
  <text class="tag" x="241" y="41">Banner</text>

  <text class="hud" x="472" y="88" font-size="30" fill="#ffffff" stroke-width="4" text-anchor="middle">Last WS: Savage Blade!</text>
  <text class="hud" x="472" y="136" font-size="36" fill="#ffd700" stroke-width="5" text-anchor="middle">54,321 damage!!</text>
  <text class="hud" x="632" y="128" font-size="22" fill="#ffffff" stroke-width="4" opacity="0.9">BIG HIT!</text>
  <text class="hud" x="472" y="182" font-size="26" fill="#78ffff" stroke-width="4" text-anchor="middle">SC Bonus: 12,345!!</text>

  <!-- ===================== PARTY PANEL ===================== -->
  <rect x="746" y="44" width="262" height="160" rx="6" fill="#00aa5a" fill-opacity="0.10"
        stroke="#00aa5a" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="746" y="28" width="96" height="18" rx="3" fill="#00aa5a"/>
  <text class="tag" x="755" y="41">Party panel</text>

  <g class="mono" font-size="12.5" fill="#ffffff">
    <text x="756" y="70" xml:space="preserve">Party WS       #     Avg    Peak</text>
    <text x="756" y="89" xml:space="preserve">Velner        12  48,210  99,999</text>
    <text x="756" y="108" xml:space="preserve">Partymember    9  31,402  62,118</text>
    <text x="756" y="127" xml:space="preserve">Ifrit          4  18,770  24,055</text>
    <text x="756" y="160" xml:space="preserve">Magic Bursts   #     Avg    Peak</text>
    <text x="756" y="179" xml:space="preserve">Blackmage      7  38,940  52,300</text>
  </g>

  <!-- ===================== SKILLCHAIN BLOCK ===================== -->
  <rect x="150" y="238" width="256" height="150" rx="6" fill="#3c78ff" fill-opacity="0.10"
        stroke="#3c78ff" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="150" y="222" width="86" height="18" rx="3" fill="#3c78ff"/>
  <text class="tag" x="159" y="235">Skillchain</text>

  <text class="mono" x="162" y="268" font-size="20" fill="#50ff78" xml:space="preserve">█████████████░░░░░</text>
  <text class="hud" x="170" y="294" font-size="15" stroke-width="3" fill="#ffffff">SC Window: <tspan fill="#50ff50">GO!! 4.2</tspan>   Chain: 1</text>
  <g class="mono" font-size="13" fill="#ffffff">
    <text x="162" y="322" xml:space="preserve"><tspan fill="#ff9a3c">[Fusion]</tspan> (Fire, Light)</text>
    <text x="162" y="344" xml:space="preserve">Savage Blade   → Lv.3 <tspan fill="#ffffaa">Light</tspan></text>
    <text x="162" y="364" xml:space="preserve">Death Blossom  → Lv.3 <tspan fill="#ffffaa">Light</tspan></text>
  </g>

  <!-- ===================== MB POPUP ===================== -->
  <rect x="532" y="238" width="320" height="86" rx="6" fill="#ff50c8" fill-opacity="0.10"
        stroke="#ff50c8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="532" y="222" width="76" height="18" rx="3" fill="#ff50c8"/>
  <text class="tag" x="541" y="235">MB popup</text>

  <text class="hud" x="692" y="274" font-size="24" fill="#ff8cff" stroke-width="4" text-anchor="middle">MB: 40,000!!</text>
  <text class="hud" x="692" y="308" font-size="24" fill="#ff8cff" stroke-width="4" text-anchor="middle">Blackmage MB: 35,120!!</text>

  <!-- ===================== BAR LEGEND ===================== -->
  <line x1="24" y1="414" x2="996" y2="414" stroke="#ffffff" stroke-opacity="0.15"/>
  <text class="note" x="30" y="440" font-weight="bold">Countdown bar:</text>

  <text class="mono" x="160" y="442" font-size="15" fill="#ff4646" xml:space="preserve">█████░░░░░░░</text>
  <text class="note" x="160" y="465">Wait… too early</text>

  <text class="mono" x="380" y="442" font-size="15" fill="#50ff78" xml:space="preserve">█████████░░░</text>
  <text class="note" x="380" y="465">GO!! use your closer</text>

  <text class="mono" x="600" y="442" font-size="15" fill="#ff8cff" xml:space="preserve">███████░░░░░</text>
  <text class="note" x="600" y="465">Burst! chain closed, nuke now</text>

  <text class="note" x="830" y="442" font-size="11.5" fill-opacity="0.75">Dashed boxes + tags are</text>
  <text class="note" x="830" y="458" font-size="11.5" fill-opacity="0.75">how //cw move shows</text>
  <text class="note" x="830" y="474" font-size="11.5" fill-opacity="0.75">each block.</text>
</svg>
